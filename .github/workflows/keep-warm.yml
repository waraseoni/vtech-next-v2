name: keep-warm

on:
  schedule:
    # 09:30–20:30 IST, Mon–Sat (04:00–15:00 UTC)
    - cron: "*/10 4-14 * * 1-6"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          if [ -z "$APP_HEALTH_URL" ]; then
            echo "APP_HEALTH_URL secret not configured — deploy pending, skipping."
            exit 0
          fi
          curl -fsS --max-time 20 "$APP_HEALTH_URL"
